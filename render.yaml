
services:
  - type: web
    name: ai-friend-companion
    env: python
    buildCommand: chmod +x build.sh && chmod +x render_app.py && ./build.sh
    startCommand: python render_app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: HUGGING_FACE_HUB_TOKEN
        sync: false
      - key: PORT
        value: 8000
    plan: free
    healthCheckPath: /health
