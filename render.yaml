
services:
  - type: web
    name: ai-friend-companion
    env: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: ./start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: HUGGING_FACE_HUB_TOKEN
        sync: false
      - key: PORT
        value: 8000
    plan: free
